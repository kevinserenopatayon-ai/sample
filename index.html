<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f8f2e8">
  <meta name="description" content="Kevin & Joana Wedding Fellowship — January 22, 2027">
  <title>Kevin & Joana | Wedding Fellowship</title>

  <!-- Elegant wedding typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="wedding">

    <!-- PAGE 1 — WELCOME -->
    <section class="page welcome-page" id="welcome" aria-label="Welcome">
      <div class="gold-frame"></div>
      <div class="welcome-content reveal">
        <h1>Kevin <span>&amp;</span> Joana</h1>
        <h2>WEDDING FELLOWSHIP</h2>
        <p class="date">JANUARY 22, 2027 <span>@</span> 4:30PM</p>
      </div>
    </section>

    <!-- PAGE 2 — INVITATION -->
    <section class="page artwork-page" id="invitation" aria-label="Invitation">
      <div class="artwork-shell reveal">
        <img src="assets/wedding-invitation.png"
             alt="Kevin and Joana wedding invitation"
             draggable="false">
      </div>
    </section>

    <!-- PAGE 3 — ATTIRE -->
    <section class="page artwork-page" id="attire" aria-label="What to wear">
      <div class="artwork-shell reveal">
        <img src="assets/what-to-wear.png"
             alt="What to wear — motif and color palette"
             draggable="false">
      </div>
    </section>

    <!-- PAGE 4 — RSVP -->
    <section class="page artwork-page" id="rsvp" aria-label="RSVP">
      <div class="artwork-shell reveal">
        <img src="assets/wedding-rsvp.png"
             alt="Wedding gifts and RSVP information"
             draggable="false">
      </div>
    </section>

    <!-- PAGE 5 — VENUE -->
    <section class="page artwork-page" id="venue" aria-label="Venue">
      <div class="artwork-shell reveal">
        <img src="assets/wedding-venue.png"
             alt="Don Jose Heights Clubhouse location and map"
             draggable="false">
      </div>
    </section>

<!-- PAGE 6 — LAST PAGE -->
<section class="page final-page" id="final" aria-label="Closing">
  <div class="gold-frame"></div>

  <div class="final-content reveal">

    <h2>
      We are incomplete<br>
      without you.
    </h2>

    <a
      href="https://docs.google.com/forms/d/e/1FAIpQLSe-5AG6Us9xkJ0Tc5o4SEvG5SC7bsLX6NHQMtDsKHsHE2JzcQ/viewform?usp=header"
      target="_blank"
      rel="noopener noreferrer"
      class="rsvp-button"
    >
      CLICK HERE TO CONFIRM ATTENDANCE
    </a>

  </div>
</section>

  </main>

  <nav class="page-dots" aria-label="Page navigation">
    <button class="dot active" data-page="0" aria-label="Go to welcome page"></button>
    <button class="dot" data-page="1" aria-label="Go to invitation page"></button>
    <button class="dot" data-page="2" aria-label="Go to attire page"></button>
    <button class="dot" data-page="3" aria-label="Go to RSVP page"></button>
    <button class="dot" data-page="4" aria-label="Go to venue page"></button>
    <button class="dot" data-page="5" aria-label="Go to final page"></button>
  </nav>

  <div class="page-counter" aria-hidden="true">
    <span id="currentPage">01</span><em>/</em><span>06</span>
  </div>

  <div class="corner-note" aria-hidden="true">K &amp; J</div>

  <script src="script.js"></script>
</body>
</html>
